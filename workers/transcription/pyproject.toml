[project]
name = "aura-worker"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    # basic-pitch 0.4.0's own PyPI metadata has a marker bug in its bare
    # (non-extra) install_requires: it requires tensorflow-macos only for
    # `python_version > "3.11"` (i.e. 3.12+), while the plain `tensorflow`
    # clause only covers `platform_system != "Darwin"` -- so on macOS +
    # Python 3.11 (this project's pin, forced by tensorflow's own cp311-only
    # wheels) NEITHER tensorflow package is installed at all, even though a
    # matching tensorflow-macos cp311-macosx_12_0_arm64 wheel exists on
    # PyPI. Verified directly against PyPI's requires_dist for basic-pitch
    # 0.4.0: the `tf` extra carries a *different*, correct marker
    # (`python_version > "3.7"`), so opting into it is the fix basic-pitch
    # itself ships for this — not a version-pin change, not a manual
    # workaround.
    "basic-pitch[tf]>=0.4",
    # On Windows, PyPI's `tensorflow==2.14.0` wheel is a metadata-only stub
    # (no Python code) whose real implementation is split out into a
    # separate `tensorflow-intel` wheel via a Windows-only marker in its own
    # METADATA (`Requires-Dist: tensorflow-intel (==2.14.0) ;
    # platform_system == "Windows"`). uv's PEP 508 resolver does NOT expand
    # markers found only in an installed *stub* wheel's own metadata into a
    # transitive pull the way pip's install-time resolver effectively does
    # here -- basic-pitch's `tf` extra only asks for bare `tensorflow`/
    # `tensorflow-macos`, so without this explicit entry `tensorflow-intel`
    # never lands in uv.lock at all and Windows ends up with a stub
    # tensorflow that has zero inference backend (verified directly: CI's
    # PyInstaller log showed "WARNING:root:Tensorflow is not installed"
    # despite `tensorflow==2.14.0` being "installed"). Adding it explicitly,
    # scoped to `sys_platform == 'win32'`, is the fix -- confirmed this is
    # the real ~271MB implementation wheel, not another stub.
    "tensorflow-intel==2.14.0 ; sys_platform == 'win32'",
    "mido>=1.3",
    "numpy>=1.26,<2",  # tensorflow 2.14 (via basic-pitch) is ABI-incompatible with numpy 2.x
    "librosa>=0.10",
    "music21>=9.1",
    "setuptools<81",  # basic-pitch's librosa/numba dependency chain imports pkg_resources at runtime
    "score-schema",
    "musicxml",
    "aura-api",
    # Detection-quality roadmap item 2: dedicated piano transcription model
    # (aura_worker.piano_engine), behind the engine adapter in
    # stages/inference.py -- piano projects only, guitar keeps basic-pitch.
    # torch is pulled from the "pytorch-cpu" index below on linux/win32 --
    # the plain PyPI `torch` wheel on Linux unconditionally requires a full
    # CUDA stack (cuda-toolkit + nvidia-cudnn/-cusparselt/-nccl/-nvshmem +
    # triton, several GB) via its own install_requires on
    # `platform_system == "Linux"`, which this app never uses (CPU-only
    # inference) and cannot afford in installer size. macOS's plain PyPI
    # wheel has no such CUDA tax (Apple has no CUDA), so it stays on the
    # default index. Verified via `uv lock` in a scratch copy: this resolves
    # without moving any pre-existing pin except `sympy` (see
    # docs/benchmarks/2026-08-21-dq2.md's "Resolution check" section) --
    # torch<2.7's own pin narrows a macOS-only transitive dependency of
    # coremltools (a basic-pitch[tf] extra never imported by this app's
    # runtime path) from 1.14.0 to 1.13.1.
    "torch>=2.5,<2.7",
    # ByteDance/Kong "High-resolution Piano Transcription" inference
    # package (code: MIT per PyPI classifier, no LICENSE file upstream --
    # see docs/benchmarks/2026-08-21-dq2.md's license record). Its own
    # checkpoint-loading code (piano_transcription_inference.inference.
    # PianoTranscription.__init__) skips its built-in Zenodo download
    # whenever a local checkpoint_path already exists and is >=1.6e8 bytes
    # -- aura_worker.piano_engine always passes a local, build-time-fetched
    # path (see scripts/fetch_piano_weights.py), so this never touches the
    # network at runtime.
    "piano_transcription_inference>=0.0.6",
    # Detection-quality roadmap item 3: opt-in source separation
    # (aura_worker.separation) before inference, guitar only -- see
    # docs/benchmarks/2026-08-21-dq3.md's "Candidate assessment" section.
    # demucs's own core deps (einops/huggingface-hub/julius/lameenc/pyyaml/
    # safetensors/sphn/torch/tqdm) are lean and resolve against this
    # project's existing torch pin without moving it (verified via a
    # scratch `uv lock`, see dq3.md's "Resolution check" section) on
    # Linux/win32. macOS x86_64 (older Intel Macs) resolves an older demucs
    # release (4.0.1, since 4.1.0's own metadata caps torch<2.3 on that one
    # platform) that pulls a heavier, disclosed-but-narrow extra dependency
    # chain (dora-search/openunmix/torchaudio and their own transitives) --
    # macOS is source-verified only in this repo's history (no local
    # runner), so this is a documented risk for a future macOS build to
    # confirm, not something blocking this item.
    "demucs>=4.0,<5",
]

[tool.uv.sources]
score-schema = { workspace = true }
musicxml = { workspace = true }
aura-api = { workspace = true }
test-fixtures = { workspace = true }
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.optional-dependencies]
test = ["pytest>=8.2", "test-fixtures"]
# Benchmark-harness scoring (aura_worker.eval.*, docs/superpowers/SESSION-HANDOFF.md's
# "Detection-quality roadmap" item 0). mir_eval is ALSO an undeclared transitive
# dependency of basic-pitch[tf] already (basic-pitch's own PyPI metadata requires
# it) -- it is listed explicitly here anyway so aura_worker.eval doesn't rely on
# another package's implementation detail staying true. Verified against
# uv.lock: pinning it here changed nothing else in the resolution (mir-eval
# 0.8.2 was already the locked version via basic-pitch).
eval = ["mir_eval>=0.7", "test-fixtures"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aura_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    # A real (basic-pitch/ffmpeg/librosa) end-to-end run against 3 curated
    # fixtures, gating aggregate onset F1 against the committed
    # docs/benchmarks baseline. Runs in `make test` by default (a few
    # seconds, well under the couple-minutes budget) but is markable/
    # excludable via `-m "not benchmark_regression"` if it ever becomes a
    # CI bottleneck -- see test_benchmark_regression.py's module docstring.
    "benchmark_regression: slow-ish real-pipeline benchmark floor guard",
]
