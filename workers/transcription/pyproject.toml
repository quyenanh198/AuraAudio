[project]
name = "aura-worker"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "basic-pitch>=0.4",
    "mido>=1.3",
    "numpy>=1.26,<2",  # tensorflow 2.14 (via basic-pitch) is ABI-incompatible with numpy 2.x
    "librosa>=0.10",
    "music21>=9.1",
    "setuptools<81",  # basic-pitch's librosa/numba dependency chain imports pkg_resources at runtime
    "score-schema",
    "musicxml",
    "aura-api",
]

[tool.uv.sources]
score-schema = { workspace = true }
musicxml = { workspace = true }
aura-api = { workspace = true }
test-fixtures = { workspace = true }

[project.optional-dependencies]
test = ["pytest>=8.2", "test-fixtures"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aura_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
