[project]
name = "aura-worker"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "boto3>=1.34",
    "rq>=1.16",
    "redis>=5.0",
    "basic-pitch>=0.4",
    "mido>=1.3",
    "numpy>=1.26",
    "score-schema",
    "musicxml",
    "aura-api",
]

[tool.uv.sources]
score-schema = { workspace = true }
musicxml = { workspace = true }
aura-api = { workspace = true }
test-fixtures = { workspace = true }

[project.optional-dependencies]
test = ["pytest>=8.2", "test-fixtures"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aura_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
