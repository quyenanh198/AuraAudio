name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # The pipeline's probe/normalize steps shell out to ffmpeg/ffprobe.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          # tensorflow==2.14.0 (pulled in by basic-pitch) only ships cp311
          # wheels; the ubuntu-latest runner's system Python is 3.12.
          python-version: "3.11"

      - name: Install python dependencies
        run: uv sync --all-packages --all-extras

      # Mirrors the Makefile's `test` target exactly, suite by suite.
      - name: score_schema tests
        run: uv run --package score-schema pytest packages/score_schema/tests

      - name: musicxml tests
        run: uv run --package musicxml pytest packages/musicxml/tests

      - name: test_fixtures tests
        run: uv run --package test-fixtures pytest packages/test_fixtures/tests

      - name: aura-api tests
        run: uv run --package aura-api pytest apps/api/tests

      - name: aura-worker tests
        run: uv run --package aura-worker pytest workers/transcription/tests

      - name: aura-api desktop tests
        run: uv run --package aura-api pytest apps/desktop/tests

  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/desktop/web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/web/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build

  rust:
    name: rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Tauri v2 Linux build prerequisites.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      # tauri.conf.json's bundle.resources references
      # resources/aura-backend/ (the PyInstaller-built backend, produced by
      # apps/desktop/build-backend.sh — gitignored, heavy: tensorflow +
      # basic-pitch model weights). tauri-build's build.rs checks that every
      # declared resource path exists on disk on every `cargo build`, not
      # just full `tauri build` bundling — it does not need to be a real,
      # working binary for that check, so a placeholder file is enough and
      # avoids duplicating the python job's heavy PyInstaller build here.
      - name: Stub backend resource for tauri-build's resource check
        run: |
          mkdir -p apps/desktop/src-tauri/resources/aura-backend
          touch apps/desktop/src-tauri/resources/aura-backend/aura-backend
          chmod +x apps/desktop/src-tauri/resources/aura-backend/aura-backend

      - name: cargo build
        working-directory: apps/desktop/src-tauri
        run: cargo build

      # Not `-D warnings`: the repo isn't pinned warning-clean, so this
      # surfaces lint output without failing the job on existing warnings.
      - name: cargo clippy
        working-directory: apps/desktop/src-tauri
        run: cargo clippy

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          # tensorflow==2.14.0 (pulled in by basic-pitch) only ships cp311
          # wheels; the ubuntu-latest runner's system Python is 3.12.
          python-version: "3.11"

      - name: Install python dependencies
        run: uv sync --all-packages --all-extras

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/web/package-lock.json

      - name: npm ci
        working-directory: apps/desktop/web
        run: npm ci

      - name: Install Playwright chromium
        working-directory: apps/desktop/web
        run: npx playwright install --with-deps chromium

      - name: Run e2e journey
        working-directory: apps/desktop/web
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/desktop/web/playwright-report/
            apps/desktop/web/test-results/
          if-no-files-found: ignore
