name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Default to read; the `release` job below elevates to write for itself
# only, since a plain workflow_dispatch (build-only) run never needs it.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    # Sum of this job's own step timeouts (18 ffmpeg + 15 Tauri deps + 25
    # PyInstaller + 30 tauri build = 88) intentionally leaves slack below
    # this job timeout rather than matching it exactly — each individual
    # apt/build step budgets for its own worst case independently, and
    # those worst cases haven't co-occurred in any run so far. 105 minutes
    # is sized off what's actually been observed across runs
    # 32223992523/32226451850/32228859288/32230007168/32231230142 (a hung
    # apt step, a too-tight cargo tauri build timeout, an apt step that
    # hit its retry-loop's own bound, and cargo tauri build completing
    # its real work in ~4 minutes but then hanging on an unwanted
    # appimage bundle for the rest of its 60-minute budget) plus real
    # slack, not off the step-timeout sum.
    timeout-minutes: 105
    outputs:
      deb_path: ${{ steps.deb.outputs.path }}
    steps:
      - uses: actions/checkout@v7

      # Diagnostic only, not a fix: ubuntu-latest's disk is finite and
      # this job stacks rust release artifacts + webkit2gtk-dev +
      # tensorflow + the PyInstaller bundle + the tauri bundle on top of
      # it. Reclaim space known-safe to remove (pre-installed Android
      # SDK / GHC toolchains this workflow never touches) before the
      # heavy steps, and log free space before/after the heaviest one
      # (PyInstaller) so a future disk-exhaustion failure is diagnosable
      # from the log instead of a bare "no space left on device".
      - name: Reclaim known-unused runner disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /opt/ghc || true
          df -h /

      # The pipeline's probe/normalize steps shell out to ffmpeg/ffprobe.
      #
      # Root cause, found from run 32230007168's actual job log (not
      # guessed): `apt-get update` always completes in seconds, but
      # `apt-get install` then hangs completely silently for exactly the
      # outer 180s `timeout` on every one of 3 retry-loop attempts, back
      # to back — i.e. NOT random intermittent flakiness recoverable by
      # retrying, but the SAME stuck package-fetch every time on this
      # runner. `Acquire::Retries=3` never helped because it only retries
      # a request that already came back with an error; apt's own
      # *default* per-connection timeout for the actual .deb download is
      # far longer than our outer kill, so apt never got the chance to
      # time out one bad mirror on its own and fail over to the next
      # candidate in its mirrorlist — our outer `timeout` just kills the
      # whole process and restarts update+install from zero instead.
      # `Acquire::http(s)::Timeout=15` makes apt itself abort a stalled
      # per-connection fetch quickly and move to the next mirror, which
      # is what should actually recover from this rather than a same-VM
      # retry loop with no visibility into *which* mirror is bad.
      - name: Install ffmpeg
        timeout-minutes: 18
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15"
          for attempt in 1 2 3; do
            if timeout 90 sudo apt-get update $APT_OPTS && \
               timeout 90 sudo apt-get install -y $APT_OPTS --fix-missing ffmpeg; then
              exit 0
            fi
            echo "::warning::apt-get install ffmpeg attempt $attempt failed or hung, retrying" >&2
            sleep 5
          done
          echo "::error::apt-get install ffmpeg failed after 3 attempts" >&2
          exit 1

      # Tauri v2 Linux build prerequisites (mirrors ci.yml's rust job),
      # same per-connection-timeout fix as ffmpeg above and for the same
      # reason — same runner, same apt-mirror-fetch stall risk.
      - name: Install Tauri system dependencies
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15"
          for attempt in 1 2 3; do
            if timeout 90 sudo apt-get update $APT_OPTS && \
               timeout 90 sudo apt-get install -y $APT_OPTS --fix-missing \
                 libwebkit2gtk-4.1-dev \
                 build-essential \
                 curl \
                 wget \
                 file \
                 libxdo-dev \
                 libssl-dev \
                 libayatana-appindicator3-dev \
                 librsvg2-dev; then
              exit 0
            fi
            echo "::warning::Tauri system deps install attempt $attempt failed or hung, retrying" >&2
            sleep 5
          done
          echo "::error::Tauri system deps install failed after 3 attempts" >&2
          exit 1

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          # tensorflow==2.14.0 (pulled in by basic-pitch) only ships cp311
          # wheels; the ubuntu-latest runner's system Python is 3.12.
          python-version: "3.11"

      - name: Install python dependencies
        run: uv sync --all-packages --all-extras

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/web/package-lock.json

      - name: npm ci
        working-directory: apps/desktop/web
        run: npm ci

      - name: Disk space before PyInstaller build
        run: df -h /

      # Heavy step: PyInstaller bundles tensorflow + basic-pitch's model
      # weights into a --onedir backend (see apps/desktop/build-backend.sh)
      # and stages it at src-tauri/resources/aura-backend/, which
      # tauri.conf.json's bundle.resources copies into the final bundle.
      - name: Build PyInstaller backend bundle
        timeout-minutes: 25
        run: bash apps/desktop/build-backend.sh

      - name: Disk space after PyInstaller build
        run: df -h /

      - name: npm run build
        working-directory: apps/desktop/web
        run: npm run build

      # @tauri-apps/cli is a pinned devDependency of apps/desktop/web
      # (installed above via npm ci) so this resolves to a prebuilt binary
      # download instead of a from-source `cargo install tauri-cli` build.
      #
      # --bundles deb: tauri.conf.json's bundle.targets is "all", which on
      # Linux also means rpm + appimage. Run 32231230142's actual log
      # shows why that's wrong here: the release compile finished in 2m37s
      # and the .deb bundle built successfully at 08:17:27, the .rpm
      # bundle built successfully at 08:17:59 — then the step produced
      # zero further output for 57 straight minutes until the 60-minute
      # timeout killed it. The real .deb existed the whole time; only a
      # subsequent step (near-certainly the appimage bundler, which
      # downloads `linuxdeploy` tooling over the network at build time —
      # the same class of "silent network stall" already hit twice on the
      # apt steps) never returned. Scoping to the one bundle format this
      # workflow actually ships avoids that path entirely, not just works
      # around it.
      - name: cargo tauri build
        timeout-minutes: 30
        working-directory: apps/desktop/src-tauri
        run: ../web/node_modules/.bin/tauri build --bundles deb

      - name: Verify .deb and report size
        id: deb
        run: |
          DEB_PATH=$(find apps/desktop/src-tauri/target/release/bundle/deb -name '*.deb' -print -quit)
          if [ -z "$DEB_PATH" ]; then
            echo "::error::No .deb found under target/release/bundle/deb" >&2
            exit 1
          fi
          SIZE_BYTES=$(stat -c%s "$DEB_PATH")
          SIZE_HUMAN=$(du -h "$DEB_PATH" | cut -f1)
          echo "path=$DEB_PATH" >> "$GITHUB_OUTPUT"
          echo "size_human=$SIZE_HUMAN" >> "$GITHUB_OUTPUT"
          echo "Built $DEB_PATH ($SIZE_HUMAN, $SIZE_BYTES bytes)"
          {
            echo "### AuraAudio .deb"
            echo "- path: \`$DEB_PATH\`"
            echo "- size: $SIZE_HUMAN ($SIZE_BYTES bytes)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload .deb artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: auraaudio-linux-deb
          path: apps/desktop/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: warn

  macos-dmg:
    name: macos-dmg
    runs-on: macos-latest
    # Mirrors `build`'s (Linux) budget for the same reason: a first-time
    # platform with no observed run history yet to size a tighter number
    # against. macos-latest is Apple Silicon (arm64) today, so this also
    # covers the tensorflow-macos wheel below.
    timeout-minutes: 90
    outputs:
      dmg_path: ${{ steps.dmg.outputs.path }}
    steps:
      - uses: actions/checkout@v7

      # No apt-equivalent system-dependency step here, unlike `build`'s
      # Linux job: Tauri v2's macOS build prerequisites (Xcode command line
      # tools, the WebKit framework) ship preinstalled on the
      # `macos-latest` GitHub-hosted image, and rustup (below) installs the
      # matching `aarch64-apple-darwin` host toolchain itself.
      #
      # ffmpeg is deliberately NOT installed here. The backend
      # (`aura_worker/stages/probe.py`, `normalize.py`, `ffmpeg_utils.py`)
      # shells out to a system `ffmpeg`/`ffprobe` binary at *runtime*, but
      # PyInstaller's `--onedir` bundle (`apps/desktop/build-backend.sh`)
      # does not bundle it — only `--collect-data basic_pitch` is passed,
      # which pulls in basic-pitch's model weights, not any ffmpeg binary.
      # This build job only compiles/bundles the app; it never runs the
      # backend or a transcription job, so ffmpeg's absence here doesn't
      # fail the build. This exactly mirrors the Linux `.deb`: that
      # package's control metadata (Tauri's `bundle.linux.deb.depends`,
      # unset in `tauri.conf.json`) declares no dependency on ffmpeg
      # either, so a `.deb` install doesn't guarantee it's present there
      # either — Linux users need ffmpeg on PATH today, same as macOS/
      # Windows users will. See SESSION-HANDOFF.md for this as a known,
      # pre-existing runtime gap (not introduced by this job).
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          # Same pin and reason as the Linux `build` job: tensorflow==2.14.0
          # (pulled in by basic-pitch) only ships cp311 wheels.
          python-version: "3.11"

      # basic-pitch 0.4.0's bare (non-extra) PyPI metadata has a marker bug:
      # it requires `tensorflow-macos` only for `python_version > "3.11"`
      # (3.12+), while its plain `tensorflow` clause only covers
      # `platform_system != "Darwin"` — so on macOS + Python 3.11 (this
      # job's pin, forced by tensorflow's own cp311-only wheels) NEITHER
      # tensorflow package would resolve at all, even though a matching
      # `tensorflow_macos-2.14.0-cp311-cp311-macosx_12_0_arm64.whl` exists
      # on PyPI. `workers/transcription/pyproject.toml` opts into
      # basic-pitch's own `tf` extra (`basic-pitch[tf]`) to route around
      # this: that extra's `tensorflow-macos` clause carries a different,
      # correct marker (`python_version > "3.7"`), which is basic-pitch's
      # own documented fix for exactly this gap — not a version-pin change,
      # not a manual/inline workaround. Confirmed directly against PyPI's
      # `requires_dist` for basic-pitch 0.4.0 and against `uv.lock`'s
      # resolution before/after the fix.
      - name: Install python dependencies
        timeout-minutes: 20
        run: uv sync --all-packages --all-extras

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/web/package-lock.json

      - name: npm ci
        working-directory: apps/desktop/web
        run: npm ci

      # Same PyInstaller bundling step as the Linux `build` job (bash works
      # natively on macOS runners) — see that job's comment for what this
      # produces and why `--collect-data basic_pitch` is required.
      - name: Build PyInstaller backend bundle
        timeout-minutes: 25
        run: bash apps/desktop/build-backend.sh

      - name: npm run build
        working-directory: apps/desktop/web
        run: npm run build

      # --bundles dmg: same reasoning as Linux's --bundles deb scoping —
      # tauri.conf.json's bundle.targets is "all", which on macOS also
      # means the intermediate .app plus a redundant .pkg/updater bundle.
      # The .app is unavoidably built as a step toward the .dmg itself, but
      # scoping to just dmg skips anything this workflow doesn't ship.
      - name: cargo tauri build
        timeout-minutes: 35
        working-directory: apps/desktop/src-tauri
        run: ../web/node_modules/.bin/tauri build --bundles dmg

      - name: Verify .dmg and report size
        id: dmg
        run: |
          DMG_PATH=$(find apps/desktop/src-tauri/target/release/bundle/dmg -name '*.dmg' -print -quit)
          if [ -z "$DMG_PATH" ]; then
            echo "::error::No .dmg found under target/release/bundle/dmg" >&2
            exit 1
          fi
          SIZE_BYTES=$(wc -c < "$DMG_PATH" | tr -d '[:space:]')
          SIZE_HUMAN=$(du -h "$DMG_PATH" | awk '{print $1}')
          echo "path=$DMG_PATH" >> "$GITHUB_OUTPUT"
          echo "size_human=$SIZE_HUMAN" >> "$GITHUB_OUTPUT"
          echo "Built $DMG_PATH ($SIZE_HUMAN, $SIZE_BYTES bytes)"
          {
            echo "### AuraAudio .dmg"
            echo "- path: \`$DMG_PATH\`"
            echo "- size: $SIZE_HUMAN ($SIZE_BYTES bytes)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload .dmg artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: auraaudio-macos-dmg
          path: apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: warn

  windows-msi:
    name: windows-msi
    runs-on: windows-latest
    # Same first-time-platform budget reasoning as macos-dmg above, plus
    # slack for the WiX Toolset download noted below.
    timeout-minutes: 90
    outputs:
      msi_path: ${{ steps.msi.outputs.path }}
    steps:
      - uses: actions/checkout@v7

      # No system-dependency step here either: windows-latest ships MSVC
      # build tools and WebView2 preinstalled (Tauri v2's Windows
      # prerequisites), and rustup (below) installs the matching
      # x86_64-pc-windows-msvc host toolchain.
      #
      # ffmpeg is deliberately NOT installed here, for the same reason as
      # macos-dmg above: it's a backend runtime dependency shelled out to
      # at request time, never bundled by PyInstaller and never invoked by
      # this build-only job. Windows users will need ffmpeg on PATH too —
      # see SESSION-HANDOFF.md.
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          # tensorflow==2.14.0 ships a cp311 win_amd64 wheel (verified
          # against uv.lock), same cp311 pin as the Linux/macOS jobs.
          python-version: "3.11"

      # This job previously failed `uv sync` in ~2s: tensorflow==2.14.0
      # (pulled in by basic-pitch) requires `tensorflow-io-gcs-filesystem
      # >=0.23.1` with no upper bound, and that package shipped its LAST
      # win_amd64 wheel at 0.31.0 (April 2023) -- every version since has
      # zero Windows wheels, so an unconstrained resolve on Windows always
      # picked a wheel-less release. Fixed via a `sys_platform == 'win32'`
      # -scoped `tool.uv.constraint-dependencies` entry in the workspace
      # root `pyproject.toml`, pinning ONLY the Windows resolution back to
      # <=0.31.0 -- confirmed via `git diff uv.lock` that Linux and darwin
      # resolutions are byte-identical to before (0.31.0 lacks a macosx
      # arm64 wheel, so a global downgrade would have broken the macOS
      # `.dmg` job above).
      #
      # This is a deliberate, user-approved downgrade of an ML-adjacent
      # transitive dependency by ~1.5 years, accepted specifically because
      # AuraAudio is 100% offline and never performs the Google Cloud
      # Storage I/O this package exists to provide -- there is no runtime
      # behavior difference between 0.31.0 and 0.37.1 for this app. See
      # the constraint's comment in the root `pyproject.toml` for the full
      # PyPI wheel-listing evidence. Revisit if/when this package regains
      # Windows wheel support upstream, or if this project ever moves off
      # the tensorflow==2.14.0 pin for an unrelated reason.
      - name: Install python dependencies
        timeout-minutes: 20
        run: uv sync --all-packages --all-extras

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/web/package-lock.json

      - name: npm ci
        working-directory: apps/desktop/web
        run: npm ci

      # `build-backend.sh` is a bash script; windows-latest ships Git for
      # Windows (Git Bash), which GitHub Actions' `shell: bash` targets
      # directly — no PowerShell port needed.
      - name: Build PyInstaller backend bundle
        shell: bash
        timeout-minutes: 25
        run: bash apps/desktop/build-backend.sh

      - name: npm run build
        working-directory: apps/desktop/web
        run: npm run build

      # --bundles msi: same scoping reasoning as Linux/macOS above —
      # tauri.conf.json's bundle.targets "all" would also build an nsis
      # installer on Windows; msi is the one this workflow ships.
      #
      # `../web/node_modules/.bin/tauri` is a POSIX shell shim (npm always
      # writes one alongside the Windows `.cmd`/`.ps1` shims), so this only
      # runs under `shell: bash`, not the runner's PowerShell default.
      #
      # WiX Toolset (the msi bundler's actual builder) is not preinstalled;
      # tauri-bundler downloads it over the network on first use. That's an
      # accepted, allowed network fetch here (Tauri's own documented
      # behavior for `--bundles msi`), not the same class of *silent stall*
      # already fixed for apt in the Linux job — if it regresses the same
      # way, the fix is the same per-connection-timeout diagnosis approach.
      - name: cargo tauri build
        shell: bash
        timeout-minutes: 40
        working-directory: apps/desktop/src-tauri
        run: ../web/node_modules/.bin/tauri build --bundles msi

      - name: Verify .msi and report size
        id: msi
        shell: bash
        run: |
          MSI_PATH=$(find apps/desktop/src-tauri/target/release/bundle/msi -name '*.msi' -print -quit)
          if [ -z "$MSI_PATH" ]; then
            echo "::error::No .msi found under target/release/bundle/msi" >&2
            exit 1
          fi
          SIZE_BYTES=$(wc -c < "$MSI_PATH" | tr -d '[:space:]')
          SIZE_HUMAN=$(du -h "$MSI_PATH" | awk '{print $1}')
          echo "path=$MSI_PATH" >> "$GITHUB_OUTPUT"
          echo "size_human=$SIZE_HUMAN" >> "$GITHUB_OUTPUT"
          echo "Built $MSI_PATH ($SIZE_HUMAN, $SIZE_BYTES bytes)"
          {
            echo "### AuraAudio .msi"
            echo "- path: \`$MSI_PATH\`"
            echo "- size: $SIZE_HUMAN ($SIZE_BYTES bytes)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload .msi artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: auraaudio-windows-msi
          path: apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

  # Only cut a Release when this run was triggered by a version tag. A
  # plain workflow_dispatch run (no tag) stops after `build`'s artifact
  # upload, so the workflow is testable without tagging — and never
  # needs `contents: write` to do so.
  release:
    name: release
    needs: [build, macos-dmg, windows-msi]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download .deb artifact
        uses: actions/download-artifact@v7
        with:
          name: auraaudio-linux-deb
          path: dist

      - name: Download .dmg artifact
        uses: actions/download-artifact@v7
        with:
          name: auraaudio-macos-dmg
          path: dist

      - name: Download .msi artifact
        uses: actions/download-artifact@v7
        with:
          name: auraaudio-windows-msi
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.dmg
            dist/*.msi
          fail_on_unmatched_files: true
