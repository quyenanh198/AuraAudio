name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Default to read; the `release` job below elevates to write for itself
# only, since a plain workflow_dispatch (build-only) run never needs it.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    # Sum of this job's own step timeouts (18 ffmpeg + 15 Tauri deps + 25
    # PyInstaller + 30 tauri build = 88) intentionally leaves slack below
    # this job timeout rather than matching it exactly — each individual
    # apt/build step budgets for its own worst case independently, and
    # those worst cases haven't co-occurred in any run so far. 105 minutes
    # is sized off what's actually been observed across runs
    # 32223992523/32226451850/32228859288/32230007168/32231230142 (a hung
    # apt step, a too-tight cargo tauri build timeout, an apt step that
    # hit its retry-loop's own bound, and cargo tauri build completing
    # its real work in ~4 minutes but then hanging on an unwanted
    # appimage bundle for the rest of its 60-minute budget) plus real
    # slack, not off the step-timeout sum.
    timeout-minutes: 105
    outputs:
      deb_path: ${{ steps.deb.outputs.path }}
    steps:
      - uses: actions/checkout@v7

      # Diagnostic only, not a fix: ubuntu-latest's disk is finite and
      # this job stacks rust release artifacts + webkit2gtk-dev +
      # tensorflow + the PyInstaller bundle + the tauri bundle on top of
      # it. Reclaim space known-safe to remove (pre-installed Android
      # SDK / GHC toolchains this workflow never touches) before the
      # heavy steps, and log free space before/after the heaviest one
      # (PyInstaller) so a future disk-exhaustion failure is diagnosable
      # from the log instead of a bare "no space left on device".
      - name: Reclaim known-unused runner disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /opt/ghc || true
          df -h /

      # The pipeline's probe/normalize steps shell out to ffmpeg/ffprobe.
      #
      # Root cause, found from run 32230007168's actual job log (not
      # guessed): `apt-get update` always completes in seconds, but
      # `apt-get install` then hangs completely silently for exactly the
      # outer 180s `timeout` on every one of 3 retry-loop attempts, back
      # to back — i.e. NOT random intermittent flakiness recoverable by
      # retrying, but the SAME stuck package-fetch every time on this
      # runner. `Acquire::Retries=3` never helped because it only retries
      # a request that already came back with an error; apt's own
      # *default* per-connection timeout for the actual .deb download is
      # far longer than our outer kill, so apt never got the chance to
      # time out one bad mirror on its own and fail over to the next
      # candidate in its mirrorlist — our outer `timeout` just kills the
      # whole process and restarts update+install from zero instead.
      # `Acquire::http(s)::Timeout=15` makes apt itself abort a stalled
      # per-connection fetch quickly and move to the next mirror, which
      # is what should actually recover from this rather than a same-VM
      # retry loop with no visibility into *which* mirror is bad.
      - name: Install ffmpeg
        timeout-minutes: 18
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15"
          for attempt in 1 2 3; do
            if timeout 90 sudo apt-get update $APT_OPTS && \
               timeout 90 sudo apt-get install -y $APT_OPTS --fix-missing ffmpeg; then
              exit 0
            fi
            echo "::warning::apt-get install ffmpeg attempt $attempt failed or hung, retrying" >&2
            sleep 5
          done
          echo "::error::apt-get install ffmpeg failed after 3 attempts" >&2
          exit 1

      # Tauri v2 Linux build prerequisites (mirrors ci.yml's rust job),
      # same per-connection-timeout fix as ffmpeg above and for the same
      # reason — same runner, same apt-mirror-fetch stall risk.
      - name: Install Tauri system dependencies
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15"
          for attempt in 1 2 3; do
            if timeout 90 sudo apt-get update $APT_OPTS && \
               timeout 90 sudo apt-get install -y $APT_OPTS --fix-missing \
                 libwebkit2gtk-4.1-dev \
                 build-essential \
                 curl \
                 wget \
                 file \
                 libxdo-dev \
                 libssl-dev \
                 libayatana-appindicator3-dev \
                 librsvg2-dev; then
              exit 0
            fi
            echo "::warning::Tauri system deps install attempt $attempt failed or hung, retrying" >&2
            sleep 5
          done
          echo "::error::Tauri system deps install failed after 3 attempts" >&2
          exit 1

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          # tensorflow==2.14.0 (pulled in by basic-pitch) only ships cp311
          # wheels; the ubuntu-latest runner's system Python is 3.12.
          python-version: "3.11"

      - name: Install python dependencies
        run: uv sync --all-packages --all-extras

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/web/package-lock.json

      - name: npm ci
        working-directory: apps/desktop/web
        run: npm ci

      - name: Disk space before PyInstaller build
        run: df -h /

      # Heavy step: PyInstaller bundles tensorflow + basic-pitch's model
      # weights into a --onedir backend (see apps/desktop/build-backend.sh)
      # and stages it at src-tauri/resources/aura-backend/, which
      # tauri.conf.json's bundle.resources copies into the final bundle.
      - name: Build PyInstaller backend bundle
        timeout-minutes: 25
        run: bash apps/desktop/build-backend.sh

      - name: Disk space after PyInstaller build
        run: df -h /

      - name: npm run build
        working-directory: apps/desktop/web
        run: npm run build

      # @tauri-apps/cli is a pinned devDependency of apps/desktop/web
      # (installed above via npm ci) so this resolves to a prebuilt binary
      # download instead of a from-source `cargo install tauri-cli` build.
      #
      # --bundles deb: tauri.conf.json's bundle.targets is "all", which on
      # Linux also means rpm + appimage. Run 32231230142's actual log
      # shows why that's wrong here: the release compile finished in 2m37s
      # and the .deb bundle built successfully at 08:17:27, the .rpm
      # bundle built successfully at 08:17:59 — then the step produced
      # zero further output for 57 straight minutes until the 60-minute
      # timeout killed it. The real .deb existed the whole time; only a
      # subsequent step (near-certainly the appimage bundler, which
      # downloads `linuxdeploy` tooling over the network at build time —
      # the same class of "silent network stall" already hit twice on the
      # apt steps) never returned. Scoping to the one bundle format this
      # workflow actually ships avoids that path entirely, not just works
      # around it.
      - name: cargo tauri build
        timeout-minutes: 30
        working-directory: apps/desktop/src-tauri
        run: ../web/node_modules/.bin/tauri build --bundles deb

      - name: Verify .deb and report size
        id: deb
        run: |
          DEB_PATH=$(find apps/desktop/src-tauri/target/release/bundle/deb -name '*.deb' -print -quit)
          if [ -z "$DEB_PATH" ]; then
            echo "::error::No .deb found under target/release/bundle/deb" >&2
            exit 1
          fi
          SIZE_BYTES=$(stat -c%s "$DEB_PATH")
          SIZE_HUMAN=$(du -h "$DEB_PATH" | cut -f1)
          echo "path=$DEB_PATH" >> "$GITHUB_OUTPUT"
          echo "size_human=$SIZE_HUMAN" >> "$GITHUB_OUTPUT"
          echo "Built $DEB_PATH ($SIZE_HUMAN, $SIZE_BYTES bytes)"
          {
            echo "### AuraAudio .deb"
            echo "- path: \`$DEB_PATH\`"
            echo "- size: $SIZE_HUMAN ($SIZE_BYTES bytes)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload .deb artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: auraaudio-linux-deb
          path: apps/desktop/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: warn

  # Only cut a Release when this run was triggered by a version tag. A
  # plain workflow_dispatch run (no tag) stops after `build`'s artifact
  # upload, so the workflow is testable without tagging — and never
  # needs `contents: write` to do so.
  release:
    name: release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download .deb artifact
        uses: actions/download-artifact@v7
        with:
          name: auraaudio-linux-deb
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
          fail_on_unmatched_files: true
