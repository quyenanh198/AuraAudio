name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Default to read; the `release` job below elevates to write for itself
# only, since a plain workflow_dispatch (build-only) run never needs it.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    # Sum of this job's own step timeouts (18 ffmpeg + 15 Tauri deps + 25
    # PyInstaller + 60 tauri build = 118) intentionally exceeds this job
    # timeout — each individual apt/build step budgets for its own worst
    # case (retried apt installs, a cold rust release compile), but those
    # worst cases are not expected to all land in the same run. 105
    # minutes is sized off what's actually been observed across runs
    # 32223992523/32226451850/32228859288 (a hung apt step, a
    # too-tight cargo tauri build timeout, and an apt step that hit its
    # retry-loop's own bound) plus real slack, not off the step-timeout
    # sum.
    timeout-minutes: 105
    outputs:
      deb_path: ${{ steps.deb.outputs.path }}
    steps:
      - uses: actions/checkout@v7

      # Diagnostic only, not a fix: ubuntu-latest's disk is finite and
      # this job stacks rust release artifacts + webkit2gtk-dev +
      # tensorflow + the PyInstaller bundle + the tauri bundle on top of
      # it. Reclaim space known-safe to remove (pre-installed Android
      # SDK / GHC toolchains this workflow never touches) before the
      # heavy steps, and log free space before/after the heaviest one
      # (PyInstaller) so a future disk-exhaustion failure is diagnosable
      # from the log instead of a bare "no space left on device".
      - name: Reclaim known-unused runner disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /opt/ghc || true
          df -h /

      # The pipeline's probe/normalize steps shell out to ffmpeg/ffprobe.
      #
      # `Acquire::Retries` alone isn't enough: it only retries a request
      # that came back with an *error*, not a connection that's simply
      # hanging with no response — which is exactly what happened. Run
      # 32223992523 hung on this apt-get for 30+ minutes with zero
      # progress (manually cancelled); the next attempt (32226451850,
      # after adding Acquire::Retries + a 10-minute step timeout)
      # succeeded in ~3 minutes; the attempt after that (32228859288)
      # hung again and hit the same 10-minute timeout almost exactly —
      # proving this is genuine intermittent mirror flakiness, not a
      # one-off. A `timeout`-wrapped bash retry loop can actually recover
      # from a hang (kill the stuck attempt, try again — sometimes on a
      # different mirror) instead of just failing faster.
      - name: Install ffmpeg
        timeout-minutes: 18
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          for attempt in 1 2 3; do
            if timeout 180 sudo apt-get update -o Acquire::Retries=3 && \
               timeout 180 sudo apt-get install -y -o Acquire::Retries=3 --fix-missing ffmpeg; then
              exit 0
            fi
            echo "::warning::apt-get install ffmpeg attempt $attempt failed or hung, retrying" >&2
            sleep 5
          done
          echo "::error::apt-get install ffmpeg failed after 3 attempts" >&2
          exit 1

      # Tauri v2 Linux build prerequisites (mirrors ci.yml's rust job,
      # plus the same timeout-wrapped retry loop as ffmpeg above — same
      # apt-mirror-stall risk, same fix).
      - name: Install Tauri system dependencies
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          for attempt in 1 2 3; do
            if timeout 180 sudo apt-get update -o Acquire::Retries=3 && \
               timeout 180 sudo apt-get install -y -o Acquire::Retries=3 --fix-missing \
                 libwebkit2gtk-4.1-dev \
                 build-essential \
                 curl \
                 wget \
                 file \
                 libxdo-dev \
                 libssl-dev \
                 libayatana-appindicator3-dev \
                 librsvg2-dev; then
              exit 0
            fi
            echo "::warning::Tauri system deps install attempt $attempt failed or hung, retrying" >&2
            sleep 5
          done
          echo "::error::Tauri system deps install failed after 3 attempts" >&2
          exit 1

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          # tensorflow==2.14.0 (pulled in by basic-pitch) only ships cp311
          # wheels; the ubuntu-latest runner's system Python is 3.12.
          python-version: "3.11"

      - name: Install python dependencies
        run: uv sync --all-packages --all-extras

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/web/package-lock.json

      - name: npm ci
        working-directory: apps/desktop/web
        run: npm ci

      - name: Disk space before PyInstaller build
        run: df -h /

      # Heavy step: PyInstaller bundles tensorflow + basic-pitch's model
      # weights into a --onedir backend (see apps/desktop/build-backend.sh)
      # and stages it at src-tauri/resources/aura-backend/, which
      # tauri.conf.json's bundle.resources copies into the final bundle.
      - name: Build PyInstaller backend bundle
        timeout-minutes: 25
        run: bash apps/desktop/build-backend.sh

      - name: Disk space after PyInstaller build
        run: df -h /

      - name: npm run build
        working-directory: apps/desktop/web
        run: npm run build

      # @tauri-apps/cli is a pinned devDependency of apps/desktop/web
      # (installed above via npm ci) so this resolves to a prebuilt binary
      # download instead of a from-source `cargo install tauri-cli` build.
      #
      # 20 minutes was too tight: run 32226451850 hit that timeout almost
      # exactly (07:17:49 -> 07:38:02, ~20m13s) and was killed mid-build.
      # Swatinem/rust-cache had nothing to restore on that run (its own
      # step completed in ~1s), so this was a genuinely cold
      # release-profile compile of Tauri/webkit2gtk plus bundling the
      # ~1.6GB PyInstaller backend — slower than the earlier estimate.
      # The job has ample headroom for a bigger number: only ~9.5 of its
      # 90 minutes were spent reaching this step.
      - name: cargo tauri build
        timeout-minutes: 60
        working-directory: apps/desktop/src-tauri
        run: ../web/node_modules/.bin/tauri build

      - name: Verify .deb and report size
        id: deb
        run: |
          DEB_PATH=$(find apps/desktop/src-tauri/target/release/bundle/deb -name '*.deb' -print -quit)
          if [ -z "$DEB_PATH" ]; then
            echo "::error::No .deb found under target/release/bundle/deb" >&2
            exit 1
          fi
          SIZE_BYTES=$(stat -c%s "$DEB_PATH")
          SIZE_HUMAN=$(du -h "$DEB_PATH" | cut -f1)
          echo "path=$DEB_PATH" >> "$GITHUB_OUTPUT"
          echo "size_human=$SIZE_HUMAN" >> "$GITHUB_OUTPUT"
          echo "Built $DEB_PATH ($SIZE_HUMAN, $SIZE_BYTES bytes)"
          {
            echo "### AuraAudio .deb"
            echo "- path: \`$DEB_PATH\`"
            echo "- size: $SIZE_HUMAN ($SIZE_BYTES bytes)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload .deb artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: auraaudio-linux-deb
          path: apps/desktop/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: warn

  # Only cut a Release when this run was triggered by a version tag. A
  # plain workflow_dispatch run (no tag) stops after `build`'s artifact
  # upload, so the workflow is testable without tagging — and never
  # needs `contents: write` to do so.
  release:
    name: release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download .deb artifact
        uses: actions/download-artifact@v7
        with:
          name: auraaudio-linux-deb
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
          fail_on_unmatched_files: true
