[project]
name = "aura-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "score-schema",
    "aura-worker",
]

[tool.uv.sources]
score-schema = { workspace = true }
aura-worker = { workspace = true }
test-fixtures = { workspace = true }

[project.optional-dependencies]
test = ["pytest>=8.2", "httpx>=0.27", "aura-worker", "test-fixtures"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aura_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
