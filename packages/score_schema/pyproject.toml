[project]
name = "score-schema"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23"]

[project.optional-dependencies]
test = ["pytest>=8.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/score_schema"]

[tool.pytest.ini_options]
testpaths = ["tests"]
