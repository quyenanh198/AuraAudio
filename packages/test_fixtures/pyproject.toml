[project]
name = "test-fixtures"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.13"]

[project.optional-dependencies]
test = ["pytest>=8.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/test_fixtures"]

[tool.pytest.ini_options]
testpaths = ["tests"]
