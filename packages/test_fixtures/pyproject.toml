[project]
name = "test-fixtures"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.13",
    "score-schema",
    # test_fixtures.real_piano decodes vendored real-piano .mp3 samples
    # (DQ-2 fixture-timbre investigation) -- already a pinned dependency
    # elsewhere in this workspace (workers/transcription), no new version
    # constraint introduced here.
    "librosa>=0.10",
]

[tool.uv.sources]
score-schema = { workspace = true }

[project.optional-dependencies]
test = ["pytest>=8.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/test_fixtures"]

[tool.pytest.ini_options]
testpaths = ["tests"]
